name: Experimental real-model evaluation

on:
  workflow_dispatch:
    inputs:
      confirm_experimental:
        description: Type EXPERIMENTAL to acknowledge that results are not publishable yet
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finsec-real-model-eval
  cancel-in-progress: false

jobs:
  compare:
    name: GPT-5.6 Luna vs Terra
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: finsec-experimental-eval

    steps:
      - name: Enforce experimental-result boundary
        env:
          CONFIRM_EXPERIMENTAL: ${{ inputs.confirm_experimental }}
        run: |
          if [ "$CONFIRM_EXPERIMENTAL" != "EXPERIMENTAL" ]; then
            echo "This workflow only creates private, unreviewed artifacts."
            echo "Rerun it and type EXPERIMENTAL to continue."
            exit 2
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install evaluation package
        run: python -m pip install -e ".[openai]"

      - name: Confirm API credential is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Repository or environment secret OPENAI_API_KEY is missing."
            exit 2
          fi

      - name: Validate candidate dataset
        run: finsec-eval validate --dataset datasets/v0.2/cases.jsonl

      - name: Record incomplete public-release gate
        id: release_gate
        continue-on-error: true
        run: |
          finsec-eval validate \
            --dataset datasets/v0.2/cases.jsonl \
            --release-ready

      - name: Run real-model comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          finsec-eval compare \
            --dataset datasets/v0.2/cases.jsonl \
            --config configs/comparison.openai.example.json \
            --output-dir reports/latest/openai-comparison \
            --source-revision "$GITHUB_SHA"

      - name: Write evaluation summary
        if: always()
        env:
          RELEASE_GATE_OUTCOME: ${{ steps.release_gate.outcome }}
        run: |
          {
            echo "## FinSec experimental model evaluation"
            echo
            echo "- Comparison: GPT-5.6 Luna vs GPT-5.6 Terra"
            echo "- Source revision: \`$GITHUB_SHA\`"
            echo "- Dataset: v0.2 release candidate"
            echo "- Public release gate: \`$RELEASE_GATE_OUTCOME\`"
            echo
            echo "> Results are private experimental artifacts until dataset owner review and result adjudication are complete."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private comparison evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finsec-openai-comparison-${{ github.run_id }}
          path: reports/latest/openai-comparison/
          if-no-files-found: error
          retention-days: 14


name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Validate datasets
        run: |
          finsec-eval validate --dataset datasets/v0.1/cases.jsonl
          finsec-eval validate --dataset datasets/v0.2/cases.jsonl

      - name: Verify generated dataset copies
        run: |
          python scripts/build_v0_2_dataset.py
          git diff --exit-code -- \
            datasets/v0.2/cases.jsonl \
            huggingface/dataset/data/cases.jsonl \
            huggingface/space/cases.jsonl

      - name: Compile Space sources
        run: python -m py_compile huggingface/space/app.py huggingface/space/space_core.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v
